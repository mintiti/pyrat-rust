name: Test

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test-engine:
    name: Engine Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v5
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v5
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v5
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('Cargo.lock') }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          engine/pyproject.toml

    - name: Create isolated engine environment
      run: |
        uv venv --no-project --python "${{ matrix.python-version }}" engine/.venv
        uv pip install --python engine/.venv/bin/python "maturin>=1.4,<2.0"

    - name: Build Rust extension
      working-directory: engine
      env:
        VIRTUAL_ENV: ${{ github.workspace }}/engine/.venv
      run: .venv/bin/maturin develop --release --uv --extras dev

    - name: Run Engine tests
      working-directory: engine
      run: .venv/bin/pytest python/tests -v

    - name: Smoke-test Python benchmarks
      working-directory: engine
      run: .venv/bin/python python/benchmarks/benchmark_engine.py --smoke --json -

  test-sdk-python:
    name: SDK Python Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v5
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v5
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v5
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('Cargo.lock') }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          sdk/python/pyproject.toml

    - name: Sync workspace dependencies
      run: uv sync --all-extras

    - name: Build SDK Python extension
      run: uv run --directory sdk/python maturin develop --release

    - name: Run SDK Python tests
      run: uv run --directory sdk/python pytest tests -v
