[package]
name = "pyrat-gui"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pyrat-rust = { path = "../../engine", default-features = false }
pyrat-host = { path = "../../server/host" }
pyrat-protocol = { path = "../../server/protocol" }
pyrat-eval = { path = "../../eval/session" }
pyrat-eval-store = { path = "../../eval/store" }
pyrat-orchestrator = { path = "../../eval/orchestrator" }
parking_lot = "0.12"
fastrand = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-specta = { version = "2.0.0-rc.21", features = ["derive", "typescript"] }
specta = { version = "2.0.0-rc.22", features = ["derive"] }
specta-typescript = "0.0.9"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync", "net", "time", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"

# Test-only: `#[tokio::test]` + a runtime so the phase-reclaim test can build
# real `JoinHandle`s. Additive for the test build only; the release binary's
# tokio features are unchanged.
[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
